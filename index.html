<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IB 히어로 테스트</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      display: none;
      animation: fadeIn 0.5s ease-in-out;
    }

    .page.active {
      display: block;
    }

    .choice-btn {
      transition: all 0.3s ease;
    }

    .choice-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    img {
      object-fit: cover;
      background-color: #f3f4f6;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-purple-200 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl p-8 md:p-12 text-center overflow-hidden">

    <!-- 시작 페이지 -->
    <section id="start-page" class="page active">
      <h1 class="text-5xl md:text-7xl font-black text-blue-700">
        IB 히어로가 되어보자!
      </h1>
      <h2 class="text-2xl md:text-4xl text-gray-600 mt-4 font-semibold">
        나는 어떤 히어로?
      </h2>
      <p class="text-lg text-gray-500 mt-6 max-w-2xl mx-auto">
        10개의 간단한 질문에 답하고,
        <br>당신 마음속에 숨어 있는 진짜 히어로를 만나보세요!
      </p>
      <button onclick="startQuiz()"
        class="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-4 px-10 rounded-full shadow-lg transform hover:scale-105 transition-transform mt-12">
        테스트 시작! ⚡
      </button>
    </section>

    <!-- 퀴즈 페이지 -->
    <section id="quiz-page" class="page">
      <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
        <div id="progress-bar"
          class="bg-blue-600 h-2.5 rounded-full transition-all duration-300"
          style="width: 0%">
        </div>
      </div>

      <p id="question-counter" class="text-xl text-gray-500 font-semibold mb-2"></p>
      <div id="question-area"></div>
    </section>

    <!-- 결과 페이지 -->
    <section id="result-page" class="page">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">
        당신의 IB 히어로는...
      </h2>

      <div class="bg-gradient-to-br from-yellow-100 to-orange-200 rounded-lg p-6 md:p-8 shadow-inner border-2 border-yellow-400">
        <img id="hero-image" src="" alt="대표 히어로 이미지"
          class="w-48 h-48 rounded-full mx-auto border-4 border-white shadow-lg mb-4">
        <h3 id="hero-title" class="text-3xl font-bold text-yellow-900"></h3>
        <p id="hero-name" class="text-2xl text-yellow-700 font-bold mb-3"></p>
        <p id="hero-description" class="text-lg text-gray-700 leading-relaxed"></p>
      </div>

      <div class="mt-12">
        <h3 class="text-2xl font-bold text-gray-800 mb-4">
          🌱 이런 힘도 키워보면 어떨까요?
        </h3>
        <div id="growth-heroes" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
      </div>

      <button onclick="restartQuiz()"
        class="bg-gray-700 hover:bg-gray-800 text-white text-xl font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-transform mt-12">
        다시하기 🔁
      </button>
    </section>

  </main>

  <script>
    // 히어로 정보와 저장한 이미지 파일 경로
    const profileData = {
      inquirer: {
        title: "탐구하는 사람 (Inquirers)",
        hero: "모아나",
        image: "images/모아나.png",
        description: "당신은 호기심이 많고, '왜?'라는 질문을 멈추지 않아요. 산호초 너머의 세상을 탐험하는 것을 두려워하지 않죠! 스스로 항해술을 연구하고 새로운 길을 개척하는 당신은 멋진 탐험가입니다."
      },
      knowledgeable: {
        title: "지식이 풍부한 사람 (Knowledgeable)",
        hero: "토니 스타크(아이언맨)",
        image: "images/아이언맨.png",
        description: "당신은 과학, 공학 등 세상의 모든 지식을 사랑해요. 그 지식으로 멋진 슈트를 만들어 세상을 구하죠! 끊임없이 새로운 지식을 탐구하고, 그것을 사용해 실제 문제를 해결하는 천재 발명가입니다."
      },
      thinker: {
        title: "생각하는 사람 (Thinkers)",
        hero: "주디 홉스",
        image: "images/주디홉스.png",
        description: "당신은 복잡한 문제가 생겨도 포기하지 않아요. 논리적인 단서 분석과 창의적인 생각으로 사건을 해결해내는 명탐정입니다."
      },
      communicator: {
        title: "의사소통을 잘하는 사람 (Communicators)",
        hero: "조이",
        image: "images/조이.jpg",
        description: "당신은 자신의 생각과 감정을 잘 표현하고 다른 사람들과 협력해요. 당신의 밝은 에너지와 표현력은 주변 사람들에게 힘을 주는 멋진 능력입니다."
      },
      principled: {
        title: "원칙을 지키는 사람 (Principled)",
        hero: "우디",
        image: "images/우디.png",
        description: "당신은 정직하고 공정한 것을 중요하게 생각해요. 어떤 위기 상황에서도 친구들을 버리지 않고, 옳은 일을 하려는 강한 신념을 가졌습니다."
      },
      open_minded: {
        title: "열린 마음을 가진 사람 (Open-minded)",
        hero: "스폰지밥",
        image: "images/스폰지밥.jpg",
        description: "당신은 친구들을 편견 없이 받아들여요. 새로운 경험을 즐겁게 배우고 다양한 생각을 존중하는 열린 마음의 소유자입니다."
      },
      caring: {
        title: "배려하는 사람 (Caring)",
        hero: "안나",
        image: "images/안나.png",
        description: "당신은 다른 사람의 감정에 깊이 공감하고, 따뜻한 마음으로 모두를 돕는 진정한 용기를 가졌습니다."
      },
      risk_taker: {
        title: "도전하는 사람 (Risk-takers)",
        hero: "루미",
        image: "images/루미.png",
        description: "당신은 불확실하고 어려운 상황에도 용감하게 맞서요. 실패를 두려워하지 않고 모두를 지키기 위해 새로운 일에 도전하는 용기 있는 히어로입니다."
      },
      balanced: {
        title: "균형 잡힌 사람 (Balanced)",
        hero: "뽀로로",
        image: "images/뽀로로.png",
        description: "당신은 친구들과 신나게 놀고 몸과 마음을 돌보면서 새로운 것도 배워요. 즐겁게 노는 것과 똑똑하게 배우는 것의 균형을 아는 멋진 친구입니다!"
      },
      reflective: {
        title: "성찰하는 사람 (Reflective)",
        hero: "엘사",
        image: "images/엘사.png",
        description: "당신은 자신의 과거와 마음을 돌아보며 '나는 누구인가?' 생각해요. 자신의 두려움을 마주하고 진짜 강점과 힘을 깨닫는 성찰의 여왕입니다."
      }
    };

    // 질문과 선택지
    const questions = [
      {
        situation: "낯선 섬에 떨어졌다!",
        answers: [
          ["inquirer", "\"저 바다 너머엔 뭐가 있을까?\" 낯선 곳이라도 호기심을 갖고, 배를 만들 재료를 찾아 탐험한다."],
          ["knowledgeable", "\"이 섬의 재료로 뭘 만들지?\" 낯선 기계 부품을 꼼꼼히 분석해서 멋진 탈출 장치를 발명한다."]
        ]
      },
      {
        situation: "우리 반에 큰 문제가 생겼다!",
        answers: [
          ["thinker", "\"단서가 있을 거야!\" 조용히 원인을 분석하고 최고의 해결책을 추리한다."],
          ["communicator", "\"얘들아, 힘내자!\" 친구들을 격려하고 다 함께 해결하자고 외친다."]
        ]
      },
      {
        situation: "가장 친한 친구가 규칙을 어겼다!",
        answers: [
          ["principled", "\"우리는 친구를 버리지 않아!\" 친구와의 약속과 우리 팀의 원칙을 지키는 게 중요하다."],
          ["caring", "\"괜찮아? 내가 도와줄게!\" 친구의 마음에 공감하고 위로하며 돕는다."]
        ]
      },
      {
        situation: "모두가 피하는 대상과 마주쳤다!",
        answers: [
          ["open_minded", "\"겉모습은 중요하지 않아.\" 퉁명스러운 친구라도 편견 없이 다가간다."],
          ["risk_taker", "\"내가 나설게!\" 사람들을 지키기 위해 용기를 내어 정면으로 맞선다."]
        ]
      },
      {
        situation: "중요한 발표를 앞두고 있다!",
        answers: [
          ["balanced", "\"노는 게 제일 좋아!\" 발표 준비도 하고 친구들과 놀며 몸과 마음의 균형을 챙긴다."],
          ["reflective", "\"나는 누구일까?\" 내가 왜 이 일을 하는지, 잘하는 것은 무엇인지 생각한다."]
        ]
      },
      {
        situation: "아무도 가보지 않은 비밀의 숲을 발견했다!",
        answers: [
          ["inquirer", "\"저기 가보자!\" 호기심이 생기면 직접 탐험하고 경험한다."],
          ["thinker", "\"저기 가면 위험할 수도 있어.\" 어떤 위험이 있을지 먼저 생각하고 계획을 세운다."]
        ]
      },
      {
        situation: "우리 팀이 위기에 빠졌다!",
        answers: [
          ["knowledgeable", "\"내가 아는 것을 활용해 보자.\" 지식을 모아 위기를 해결할 방법을 만든다."],
          ["principled", "\"정직하지 않은 방법은 안 돼.\" 원칙에 어긋나는 방법은 선택하지 않는다."]
        ]
      },
      {
        situation: "내 생각과 전혀 다른 친구를 만났다!",
        answers: [
          ["communicator", "\"내 생각은 이래.\" 내 생각을 자신 있게 표현하며 대화한다."],
          ["open_minded", "\"네 생각은 어때?\" 나와 다른 친구의 생각과 문화를 존중하고 궁금해한다."]
        ]
      },
      {
        situation: "친구를 구하러 가야 한다!",
        answers: [
          ["caring", "\"너를 위해서라면!\" 친구를 돕기 위해 먼저 다가간다."],
          ["balanced", "\"괜찮아! 다 방법이 있지!\" 침착하게 친구들과 힘을 합칠 계획을 세운다."]
        ]
      },
      {
        situation: "나에게 숨겨진 특별한 힘이 생겼다!",
        answers: [
          ["risk_taker", "\"두렵지만 해내고 말겠어!\" 모두를 위해 용기를 내어 정면으로 부딪힌다."],
          ["reflective", "\"난 왜 이런 힘을 가졌을까?\" 내 마음을 돌아보고 나 자신을 먼저 이해하려 한다."]
        ]
      }
    ];

    let scores = {};
    let currentQuestion = 0;

    function showPage(pageId) {
      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });
      document.getElementById(pageId).classList.add("active");
    }

    function startQuiz() {
      scores = {};
      Object.keys(profileData).forEach(key => scores[key] = 0);
      currentQuestion = 0;
      showPage("quiz-page");
      showQuestion();
    }

    function showQuestion() {
      if (currentQuestion >= questions.length) {
        showResult();
        return;
      }

      const question = questions[currentQuestion];
      document.getElementById("question-counter").textContent =
        `질문 ${currentQuestion + 1} / ${questions.length}`;

      document.getElementById("progress-bar").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

      const choices = question.answers.map(([key, text]) => `
        <button onclick="selectAnswer('${key}')"
          class="choice-btn p-6 bg-gray-50 hover:bg-blue-100 border-2 border-gray-200 hover:border-blue-400 rounded-lg shadow-md cursor-pointer">
          <p class="text-lg md:text-xl text-gray-700">${text}</p>
        </button>
      `).join("");

      document.getElementById("question-area").innerHTML = `
        <div class="question-slide active">
          <h3 class="text-2xl md:text-3xl font-semibold text-gray-800 mb-10">
            [상황: ${question.situation}] 나는...
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${choices}</div>
        </div>
      `;
    }

    function selectAnswer(profileKey) {
      scores[profileKey]++;
      currentQuestion++;
      showQuestion();
    }

    function showResult() {
      const sortedScores = Object.entries(scores)
        .sort((a, b) => b[1] - a[1]);

      const mainHero = profileData[sortedScores[0][0]];
      const growHero1 = profileData[sortedScores[sortedScores.length - 1][0]];
      const growHero2 = profileData[sortedScores[sortedScores.length - 2][0]];

      document.getElementById("hero-image").src = mainHero.image;
      document.getElementById("hero-title").textContent = mainHero.title;
      document.getElementById("hero-name").textContent = `"${mainHero.hero}" 타입!`;
      document.getElementById("hero-description").textContent = mainHero.description;

      document.getElementById("growth-heroes").innerHTML =
        [growHero1, growHero2].map(hero => `
          <div class="bg-gray-100 p-4 rounded-lg flex items-center shadow-sm text-left">
            <img src="${hero.image}" alt="${hero.hero}"
              class="w-20 h-20 rounded-full border-2 border-white shadow-md flex-shrink-0">
            <div class="ml-4">
              <h4 class="text-lg font-bold text-blue-800">${hero.title}</h4>
              <p class="font-bold text-blue-600">${hero.hero}</p>
            </div>
          </div>
        `).join("");

      showPage("result-page");
    }

    function restartQuiz() {
      showPage("start-page");
    }
  </script>
</body>
</html>
